<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bassline Generator — MIDI</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

<header class="topbar">
  <h1 class="brand">bassline<span>generator</span></h1>
  <div class="midi-status" id="midiStatus">
    <span class="midi-status__dot" id="midiStatusDot"></span>
    <span id="midiStatusText">buscando MIDI…</span>
    <span class="midi-status__clock" id="clockModeText"></span>
  </div>
</header>

<main class="rack">

  <!-- TRANSPORT -->
  <section class="panel panel--transport" data-name="transport">
    <div class="control-row">
      <button id="btnPlay" class="btn btn--primary">Play</button>
      <button id="btnStop" class="btn">Stop</button>

      <label class="field">
        <span class="field__label">tempo</span>
        <input type="number" id="tempo" class="field__number" min="20" max="300" value="120" />
        <span class="field__unit">bpm</span>
      </label>

      <label class="field field--range">
        <span class="field__label">swing</span>
        <input type="range" id="swing" min="0" max="100" value="0" />
        <span class="field__value" id="swingValue">0%</span>
      </label>

      <label class="field field--grow">
        <span class="field__label">midi out</span>
        <select id="midiOutput" class="field__select"></select>
      </label>

      <label class="field">
        <span class="field__label">canal</span>
        <select id="midiChannel" class="field__select"></select>
      </label>

      <button id="btnPanic" class="btn btn--ghost btn--danger" title="Apagar todas las notas">panic</button>
    </div>
  </section>

  <div class="rack__columns">

    <!-- MUSICAL -->
    <section class="panel panel--musical" data-name="root">
      <div class="tonal-layout">
        <div class="tonal-layout__main">
          <label class="field field--compact">
            <span class="field__label">root</span>
            <select id="rootNote" class="field__select"></select>
          </label>

          <label class="field field--compact">
            <span class="field__label">scale</span>
            <select id="scale" class="field__select"></select>
          </label>

          <label class="field field--compact">
            <span class="field__label">rango</span>
            <span class="range-pair">
              <select id="octaveMin" class="field__select"></select>
              <span class="range-pair__sep">a</span>
              <select id="octaveMax" class="field__select"></select>
            </span>
          </label>

          <label class="field field--compact">
            <span class="field__label">pasos</span>
            <select id="steps" class="field__select"></select>
          </label>

          <label class="field field--compact">
            <span class="field__label">rate</span>
            <select id="rate" class="field__select"></select>
          </label>
        </div>

        <div class="tonal-layout__octave">
          <span class="field__label">octave</span>
          <!-- El <select> sigue siendo el control real (misma lógica); el
               stepper vertical es solo la piel visual, montado por knob-ui.js -->
          <label class="field gen-legacy">
            <select id="octave" class="field__select"></select>
          </label>
          <div id="mountOctaveStepper"></div>
        </div>
      </div>
    </section>

    <!-- GENERATOR -->
    <section class="panel panel--generator" data-name="generator">
      <div class="beat-columns">
        <div class="beat-col beat-col--onbeat">
          <div class="beat-col__title">on beat</div>
          <div class="beat-col__main" id="mountDensityKnob"></div>
          <div class="beat-col__row">
            <div id="mountRestKnobA"></div>
            <div id="mountAccentKnobA"></div>
          </div>
          <div class="beat-col__row">
            <div id="mountShapeA"></div>
            <div id="mountAmountKnobA"></div>
          </div>
        </div>

        <div class="beat-col beat-col--offbeat">
          <div class="beat-col__title">off beat</div>
          <div class="beat-col__main" id="mountComplexityKnob"></div>
          <div class="beat-col__row">
            <div id="mountRestKnobB"></div>
            <div id="mountAccentKnobB"></div>
          </div>
          <div class="beat-col__row">
            <div id="mountShapeB"></div>
            <div id="mountAmountKnobB"></div>
          </div>
        </div>
      </div>

      <!-- Controles reales: misma lógica, ocultos visualmente. Cada knob de
           arriba lee/escribe el suyo propio — ya no hay dos knobs
           compartiendo un mismo input (On Beat y Off Beat son independientes). -->
      <div class="gen-legacy">
        <input type="range" id="density" min="0" max="100" value="75" />
        <span id="densityValue">75%</span>
        <input type="range" id="complexity" min="0" max="100" value="45" />
        <span id="complexityValue">45%</span>

        <input type="range" id="restsOnbeat" min="0" max="100" value="10" />
        <input type="range" id="restsOffbeat" min="0" max="100" value="10" />
        <input type="range" id="accentOnbeat" min="0" max="100" value="25" />
        <input type="range" id="accentOffbeat" min="0" max="100" value="25" />
        <select id="variationShapeOnbeat" class="field__select"></select>
        <select id="variationShapeOffbeat" class="field__select"></select>
        <input type="range" id="variationAmountOnbeat" min="-100" max="100" value="0" />
        <input type="range" id="variationAmountOffbeat" min="-100" max="100" value="0" />
      </div>

      <div class="subhead">pitch weights</div>
      <div class="weights-row">
        <div id="mountWeightRoot"></div>
        <div id="mountWeightFifth"></div>
        <div id="mountWeightThird"></div>
        <div id="mountWeightOther"></div>
      </div>
      <div class="gen-legacy">
        <input type="range" id="weightRoot" min="0" max="100" value="40" title="Peso relativo (no hace falta que sumen 100)" />
        <span id="weightRootValue">40</span>
        <input type="range" id="weightFifth" min="0" max="100" value="20" title="Peso relativo (no hace falta que sumen 100)" />
        <span id="weightFifthValue">20</span>
        <input type="range" id="weightThird" min="0" max="100" value="15" title="Peso relativo (no hace falta que sumen 100)" />
        <span id="weightThirdValue">15</span>
        <input type="range" id="weightOther" min="0" max="100" value="25" title="Peso relativo (no hace falta que sumen 100)" />
        <span id="weightOtherValue">25</span>
      </div>

      <div class="control-row control-row--locks">
        <button id="btnLockRhythm" type="button" class="lock-btn" aria-pressed="false" title="Lock Rhythm: congela qué pasos suenan al regenerar">
          <svg viewBox="0 0 24 24" class="lock-btn__icon"><rect x="3" y="10" width="4" height="8"/><rect x="10" y="4" width="4" height="14"/><rect x="17" y="10" width="4" height="8"/></svg>
          <span class="lock-btn__label">rhythm</span>
        </button>
        <button id="btnLockPitch" type="button" class="lock-btn" aria-pressed="false" title="Lock Pitch: congela la curva de tono al regenerar">
          <svg viewBox="0 0 24 24" class="lock-btn__icon"><circle cx="7" cy="17.5" r="3"/><circle cx="17" cy="14.5" r="3"/><path d="M10 17.5L10 5.5L20 3.5L20 12.5" fill="none"/></svg>
          <span class="lock-btn__label">pitch</span>
        </button>
      </div>

      <div class="control-row control-row--seed">
        <label class="field field--grow">
          <span class="field__label">seed</span>
          <input type="text" id="seed" class="field__text" value="12345" />
        </label>
        <button id="btnNewSeed" class="btn btn--ghost" title="Nuevo seed aleatorio">dice</button>
        <button id="btnGenerate" class="btn btn--accent">Generate</button>
      </div>
    </section>

  </div>

  <!-- STEP SEQUENCER -->
  <section class="panel panel--steps" data-name="pattern">
    <div class="control-row control-row--tools">
      <span class="field__label">shift</span>
      <button id="btnShiftLeft" type="button" class="btn btn--ghost btn--small" title="Rotar el patrón un paso hacia atrás">-1</button>
      <button id="btnShiftRight" type="button" class="btn btn--ghost btn--small" title="Rotar el patrón un paso hacia adelante">+1</button>

      <span class="field__label control-row__spacer">slots</span>
      <button id="btnSaveSlot" type="button" class="btn btn--ghost btn--toggle btn--small" aria-pressed="false" title="Activar y después tocar un número para guardar el patrón actual ahí">save</button>
      <div class="slot-buttons" id="slotButtons"></div>

      <span class="hint">nota: click = on/off, arrastrar = tono · fila de abajo: duración</span>
    </div>
    <div class="note-display" id="noteDisplay">
      <p class="note-display__empty" id="noteDisplayEmpty">Presioná «Generate» para crear un patrón.</p>
    </div>
  </section>

  <div id="pitchTooltip" class="pitch-tooltip" hidden></div>

</main>

<script src="js/scales.js"></script>
<script src="js/rng.js"></script>
<script src="js/pattern.js"></script>
<script src="js/generator.js"></script>
<script src="js/midi.js"></script>
<script src="js/clock.js"></script>
<script src="js/sequencer.js"></script>
<script src="js/ui.js"></script>
<script src="js/knob-ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
